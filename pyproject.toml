[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knx-alarmserver"
version = "0.12.10"
description = "KNX/IP Alarmserver mit Weboberflaeche fuer Raspberry Pi OS"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.53.0", "xknx==4.0.0"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
knx-alarmserver = "knx_alarmserver.cli:main"

[tool.setuptools.package-data]
knx_alarmserver = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

