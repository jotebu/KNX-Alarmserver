# Nur generische Beispiele. Keine echten Zugangsdaten oder Gebaeudedaten einchecken.
[server]
host = "0.0.0.0" # Direkter LAN-Zugriff: http://RASPBERRY-IP:8080
port = 8080
database = "/var/lib/knx-alarmserver/alarmserver.sqlite3"
alarms = "/etc/knx-alarmserver/alarms.csv"
retention_days = 365

[knx]
# Erst nach Abgleich von ETS, Router und Alarmmatrix aktivieren.
enabled = false

[[knx.connections]]
name = "Hauptlinie"
type = "tunneling"
gateway_ip = "192.0.2.30" # Dokumentationsadresse: durch echte MDT-IP ersetzen
gateway_port = 3671
# local_ip = "192.0.2.50" # Pi-IP bei mehreren Netzwerkschnittstellen

# Weitere Tunnel nur, wenn die Hauptlinie nicht alle Alarmadressen liefert.
# [[knx.connections]]
# name = "Untergeschoss"
# type = "tunneling"
# gateway_ip = "192.0.2.31"

