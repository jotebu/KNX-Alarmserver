name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -c 'import fastapi, httpx, xknx'
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/install.sh scripts/update.sh
      - name: Check service unit
        run: systemd-analyze verify systemd/knx-alarmserver.service 2>&1 | tee /tmp/verify.log; ! grep -v 'Command.*is not executable\|No such file or directory' /tmp/verify.log | grep -q .
