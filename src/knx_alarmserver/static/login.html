<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden · KNX Alarmserver</title><link rel="stylesheet" href="/static/style.css"><script src="/static/login.js" defer></script></head>
<body><header><div class="brand">KNX<span>ALARM SERVER</span></div></header><main class="login"><section class="panel"><h1>Anmelden</h1><p>Bitte mit deinem Benutzerkonto anmelden.</p><form id="login-form"><div class="knx-fields"><label>E-Mail-Adresse<input id="login-name" autocomplete="username" required maxlength="254" autofocus></label><label>Passwort<input id="login-password" type="password" autocomplete="current-password" required maxlength="1024"></label></div><p id="login-feedback" role="alert"></p><button id="login-submit" type="submit">Anmelden</button></form></section></main></body></html>
